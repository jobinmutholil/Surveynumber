    <script>
        // ---------- 0. Live Compass Logic ----------
        let compassActive = false;
        let currentHeading = 0;

        function getCardinalDirection(angle) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(((angle %= 360) < 0 ? angle + 360 : angle) / 45) % 8;
            return directions[index];
        }

        function updateCompassUI(heading) {
            currentHeading = heading;
            const dial = document.getElementById('compassDial');
            const badge = document.getElementById('compassDegree');
            const widget = document.getElementById('compassWidget');

            if (dial && badge) {
                // Rotate dial opposite to device heading so 'N' points to real magnetic North
                dial.style.transform = `rotate(${-heading}deg)`;
                const rounded = Math.round(heading);
                const dir = getCardinalDirection(rounded);
                badge.innerText = `${rounded}° ${dir}`;
                widget.classList.add('active-sensor');
            }
        }

        function handleOrientation(event) {
            let heading = null;

            // iOS devices provide webkitCompassHeading directly
            if (typeof event.webkitCompassHeading !== 'undefined' && event.webkitCompassHeading !== null) {
                heading = event.webkitCompassHeading;
            } else if (event.absolute === true && event.alpha !== null) {
                heading = 360 - event.alpha;
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha;
            }

            if (heading !== null && !isNaN(heading)) {
                heading = (heading + 360) % 360;
                compassActive = true;
                updateCompassUI(heading);
            }
        }

        function initCompassListeners() {
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            } else if ('ondeviceorientation' in window) {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        async function enableCompassSensor() {
            // Request permission on iOS 13+ devices
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        showToast('കോമ്പസ് സജീവമായി! 🧭');
                    } else {
                        showToast('കോമ്പസ് അനുമതി നിഷേധിക്കപ്പെട്ടു.');
                    }
                } catch (err) {
                    showToast('കോമ്പസ് സെൻസർ പിന്തുണയ്ക്കുന്നില്ല.');
                }
            } else {
                initCompassListeners();
                if (compassActive) {
                    const dir = getCardinalDirection(Math.round(currentHeading));
                    showToast(`ദിശ: ${Math.round(currentHeading)}° ${dir} (വടക്ക് സൂചി ചുവപ്പ് നിറത്തിൽ) 🧭`);
                } else {
                    showToast('മാപ്പിന്റെ മുകൾഭാഗം വടക്ക് (North - 0°) ദിശയാണ് 🧭');
                }
            }
        }

        // Start listening automatically on Android / supported browsers
        initCompassListeners();

        // ---------- 1. PWA Install Logic ----------
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'flex';
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            document.getElementById('installBtn').style.display = 'none';
            showToast('ആപ്പ് വിജയകരമായി ഇൻസ്റ്റാൾ ചെയ്തു! 🎉');
        });

        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            document.getElementById('installBtn').style.display = 'none';
        }

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    deferredPrompt = null;
                }
            } else {
                document.getElementById('installModal').style.display = 'flex';
            }
        }

        function closeInstallModal() {
            document.getElementById('installModal').style.display = 'none';
        }

        // ---------- 2. Share App ----------
        async function shareApp() {
            const shareUrl = 'https://jobinmutholil.github.io/Surveynumber/';
            const shareData = {
                title: 'Kerala Survey & Village Tracker',
                text: '🗺️ കേരളത്തിലെ വില്ലേജ്, സർവ്വേ നമ്പർ വിവരങ്ങൾ ഭൂപടത്തിൽ നേരിട്ട് കാണാം:',
                url: shareUrl
            };

            if (navigator.share) {
                try { await navigator.share(shareData); } catch (err) { console.log('Share cancelled'); }
            } else {
                navigator.clipboard.writeText(`${shareData.text} ${shareUrl}`);
                showToast('ലിങ്ക് കോപ്പി ചെയ്തു! 📋');
            }
        }

        let lastSelectedDetails = null;
        async function shareLocationDetails() {
            if (!lastSelectedDetails) return;
            const { village, survey, taluk, district, lat, lon } = lastSelectedDetails;
            const appLink = `https://jobinmutholil.github.io/Surveynumber/?lat=${lat.toFixed(5)}&lng=${lon.toFixed(5)}&z=17`;
            const gmapLink = `https://www.google.com/maps?q=${lat},${lon}`;

            const cleanVillage = village.replace(/<[^>]*>?/gm, '');
            const text = `📍 *ഭൂമി വിവരങ്ങൾ*\n🏘️ വില്ലേജ്: ${cleanVillage}\n🔢 സർവ്വേ നമ്പർ: ${survey || 'ലഭ്യമല്ല'}\n📍 താലൂക്ക്: ${taluk}\n🏛️ ജില്ല: ${district}\n\n🗺️ മാപ്പ്: ${appLink}\n🧭 Google Maps: ${gmapLink}`;

            if (navigator.share) {
                try { await navigator.share({ title: `Survey No: ${survey}`, text: text }); } catch (err) { }
            } else {
                navigator.clipboard.writeText(text);
                showToast('വിവരങ്ങൾ കോപ്പി ചെയ്തു! 📋');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        // ---------- 3. Map Initialization ----------
        const urlParams = new URLSearchParams(window.location.search);
        const initLat = parseFloat(urlParams.get('lat')) || 9.6675;
        const initLng = parseFloat(urlParams.get('lng')) || 76.8256;
        const initZoom = parseInt(urlParams.get('z')) || 15;

        const map = L.map('map', { zoomControl: false }).setView([initLat, initLng], initZoom); 
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles © Esri' });
        const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: '© Google' });

        googleStreets.addTo(map);

        map.createPane('villagePane');
        map.getPane('villagePane').style.filter = 'sepia(100%) hue-rotate(-45deg) saturate(400%) brightness(50%) contrast(150%)';

        const cadastralLayer = L.tileLayer.wms('https://bhuvan-panchayat3.nrsc.gov.in/geoserver/gwc/service/wms', {
            layers: 'v3:cadastral', format: 'image/png', transparent: true, version: '1.1.1', minZoom: 8, maxZoom: 20
        }).addTo(map);

        const bhuvanVillageLayer1 = L.tileLayer.wms('https://bhuvan-panchayat3.nrsc.gov.in/geoserver/gwc/service/wms', {
            layers: 'v3:village', format: 'image/png', transparent: true, version: '1.1.1', minZoom: 5, maxZoom: 20, pane: 'villagePane'
        }).addTo(map);

        L.control.layers(
            { "🗺️ Google Streets": googleStreets, "🛰️ Satellite": satellite, "🛣️ OpenStreetMap": osm },
            { "📜 Survey Numbers": cadastralLayer, "🏛️ Village Boundary": bhuvanVillageLayer1 },
            { position: 'topright' }
        ).addTo(map);

        // Layer to store searched/highlighted survey plot or marker
        let searchResultLayer = L.layerGroup().addTo(map);
        let lastGeocodedVillage = { name: '', lat: null, lon: null };

        // ---------- WMS Fetching Logic ----------
        async function getWMSFeaturesInfo(layerName, lat, lon, featureCount = 10, buffer = 5) {
            const size = map.getSize();
            const bounds = map.getBounds();
            const sw = bounds.getSouthWest();
            const ne = bounds.getNorthEast();
            const bbox = `${sw.lng},${sw.lat},${ne.lng},${ne.lat}`;
            const point = map.latLngToContainerPoint(L.latLng(lat, lon));
            const x = Math.round(point.x);
            const y = Math.round(point.y);
            
            const endpoints = [
                `https://bhuvan-panchayat3.nrsc.gov.in/geoserver/v3/wms`,
                `https://bhuvan-panchayat3.nrsc.gov.in/geoserver/wms`,
                `https://bhuvan-panchayat3.nrsc.gov.in/geoserver/gwc/service/wms`
            ];

            for (const baseUrl of endpoints) {
                try {
                    const jsonUrl = `${baseUrl}?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS=${layerName}&QUERY_LAYERS=${layerName}&SRS=EPSG:4326&BBOX=${bbox}&WIDTH=${size.x}&HEIGHT=${size.y}&X=${x}&Y=${y}&INFO_FORMAT=application/json&FEATURE_COUNT=${featureCount}&BUFFER=${buffer}`;
                    const res = await fetch(jsonUrl);
                    if (res.ok) {
                        const contentType = res.headers.get("content-type") || "";
                        if (contentType.includes("application/json")) {
                            const data = await res.json();
                            if (data && data.features && data.features.length > 0) return data.features.map(f => f.properties);
                        }
                    }
                    const htmlUrl = `${baseUrl}?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS=${layerName}&QUERY_LAYERS=${layerName}&SRS=EPSG:4326&BBOX=${bbox}&WIDTH=${size.x}&HEIGHT=${size.y}&X=${x}&Y=${y}&INFO_FORMAT=text/html&FEATURE_COUNT=${featureCount}&BUFFER=${buffer}`;
                    const htmlRes = await fetch(htmlUrl);
                    if (htmlRes.ok) {
                        const htmlText = await htmlRes.text();
                        const parsedProps = parseHTMLFeatureInfo(htmlText);
                        if (parsedProps.length > 0) return parsedProps;
                    }
                } catch (err) {}
            }
            return [];
        }

        function parseHTMLFeatureInfo(htmlText) {
            const results = [];
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const tables = doc.querySelectorAll('table');
                tables.forEach(table => {
                    const headers = Array.from(table.querySelectorAll('th')).map(th => th.innerText.trim());
                    const rows = table.querySelectorAll('tr');
                    rows.forEach(row => {
                        const cells = Array.from(row.querySelectorAll('td')).map(td => td.innerText.trim());
                        if (cells.length === headers.length && headers.length > 0) {
                            const obj = {};
                            headers.forEach((h, i) => obj[h] = cells[i]);
                            results.push(obj);
                        }
                    });
                });
            } catch (e) {}
            return results;
        }

        function extractSurveyNumber(propertiesList) {
            if (!propertiesList || propertiesList.length === 0) return '';
            const priorityKeys = ['kide', 's_no', 'sno', 'sy_no', 'sur_no', 'survey_no', 'survey_num', 'survey', 'plot_no', 'plot', 'khasra_no', 'khasra', 'parcel_no', 'parcel_id', 'label', 'text', 'name', 'id_1', 'num'];
            const ignoreKeywords = ['bbox', 'geom', 'shape', 'area', 'len', 'perim', 'vill', 'taluk', 'tehsil', 'dist', 'state', 'st_', 'dt_', 'th_', 'vl_', 'code', 'lgd', 'cen_', 'objectid', 'fid', 'gid'];

            for (const props of propertiesList) {
                for (const pKey of priorityKeys) {
                    for (const key in props) {
                        if (key.toLowerCase() === pKey || key.toLowerCase().includes(pKey)) {
                            const val = String(props[key] ?? '').trim();
                            if (val && val !== 'null' && val !== '0' && val !== 'undefined') return val;
                        }
                    }
                }
                for (const key in props) {
                    const keyLower = key.toLowerCase();
                    if (ignoreKeywords.some(ig => keyLower.includes(ig))) continue;
                    const val = String(props[key] ?? '').trim();
                    if (val && /^[0-9]{1,5}([\/\-][0-9A-Za-z]+)?$/.test(val) && val !== '0') return val;
                }
            }
            return '';
        }

        function extractVillageName(propertiesList) {
            for (const props of propertiesList) {
                const villageKeys = ['GP_NAME', 'gp_name', 'PANCHAYAT', 'panchayat', 'VILL_NAME', 'VILLAGE', 'village', 'v_name', 'vname', 'village_name', 'NAME', 'name'];
                for (const vKey of villageKeys) {
                    for (const key in props) {
                        if (key.toLowerCase() === vKey.toLowerCase()) {
                            const val = String(props[key] ?? '').trim();
                            if (val && val !== 'null' && val !== 'undefined' && !/^[0-9]+$/.test(val)) return val;
                        }
                    }
                }
            }
            return 'അജ്ഞാതം (Unknown)';
        }

        // ---------- Inspect & Show Popup at Specific Lat/Lng ----------

                    getWMSFeaturesInfo('v3:village', lat, lon, 1, 1),

                ]);

                let osmLocalName = '';

                    districtName = addr.state_district || addr.district || 'അജ്ഞാതം';
                    osmLocalName = addr.village || addr.town || addr.suburb || addr.hamlet || addr.locality || '';
                }

                let bhuvanVillage = 'അജ്ഞാതം (Unknown)';
                if (villagePropsList.length > 0) bhuvanVillage = extractVillageName(villagePropsList);

                        const cadVillage = extractVillageName(cadastralPropsList);
                        if (cadVillage !== 'അജ്ഞാതം (Unknown)') bhuvanVillage = cadVillage;

                if (osmLocalName && bhuvanVillage !== 'അജ്ഞാതം (Unknown)') {

                } else if (osmLocalName) {
                    villageName = osmLocalName;
                } else {
                    villageName = bhuvanVillage;
                }

                if (customTitle && !surveyNo) {
                    surveyNo = customTitle;

                lastSelectedDetails = { village: villageName, survey: surveyNo, taluk: talukName, district: districtName, lat: lat, lon: lon };

                let popupContent = `<div style="font-size: 14px; line-height: 1.8;"><b>🏘️ വില്ലേജ്:</b> ${villageName}<br>`;

                } else if (currentZoom < 14) {

                } else {

        // ---------- Map Click Event ----------

        // ---------- Village & Survey Number Combined Search ----------
        function handleSearchKeyPress(event) {
            if (event.key === 'Enter') performCombinedSearch();
        }

        async function performCombinedSearch() {
            const villageQuery = document.getElementById('villageSearchInput').value.trim();
            const surveyQuery = document.getElementById('surveySearchInput').value.trim();

            if (!villageQuery && !surveyQuery) {
                showToast('ദയവായി വില്ലേജ് പേരോ സർവ്വേ നമ്പറോ നൽകുക.');
                return;
            }

            map.stopLocate();
            map.closePopup();
            searchResultLayer.clearLayers();

            const loadingPopup = L.popup()
                .setLatLng(map.getCenter())
                .setContent('<div style="text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> തിരയുന്നു...</div>')
                .openOn(map);

            let targetLat = map.getCenter().lat;
            let targetLon = map.getCenter().lng;

            // Step 1: If Village name is entered, check if we need to move the map
            if (villageQuery) {
                const isSameVillage = lastGeocodedVillage.name.toLowerCase() === villageQuery.toLowerCase() && lastGeocodedVillage.lat !== null;
                const vCoords = isSameVillage ? lastGeocodedVillage : await geocodeVillageName(villageQuery);

                if (vCoords) {
                    lastGeocodedVillage = { name: villageQuery, lat: vCoords.lat, lon: vCoords.lon };
                    const distFromCurrentCenter = map.distance(map.getCenter(), L.latLng(vCoords.lat, vCoords.lon));

                    // If user is more than 4km away from the village (or only searching village), move map to village
                    if (!surveyQuery || distFromCurrentCenter > 4000) {
                        targetLat = vCoords.lat;
                        targetLon = vCoords.lon;
                        map.setView([targetLat, targetLon], surveyQuery ? 16 : 15);
                    } else {
                        // User is already looking at the village area; search around their current map view first
                        targetLat = map.getCenter().lat;
                        targetLon = map.getCenter().lng;
                    }
                } else if (!surveyQuery) {
                    loadingPopup.setContent('<span style="color:#ef4444;">വില്ലേജ് കണ്ടെത്താൻ കഴിഞ്ഞില്ല. ഇംഗ്ലീഷിൽ ടൈപ്പ് ചെയ്യുക.</span>');
                    return;
                }
            }

            // Step 2: If only Village was entered, mark the village and stop
            if (!surveyQuery) {
                loadingPopup.close();
                L.marker([targetLat, targetLon]).addTo(searchResultLayer)
                    .bindPopup(`<b>🏘️ ${villageQuery}</b>`).openPopup();
                return;
            }

            // Step 3: Search for the Survey Number around current view & village center
            const updateSearchStatus = (msg) => {
                loadingPopup.setLatLng(map.getCenter())
                    .setContent(`<div style="text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> സർവ്വേ നമ്പർ <b>${surveyQuery}</b> തിരയുന്നു...<br><span style="font-size:11px; color:#64748b;">${msg}</span></div>`);
            };

            updateSearchStatus('മാപ്പ് പരിശോധിക്കുന്നു...');
            let foundResult = await searchSurveyPlotInArea(surveyQuery, targetLat, targetLon, updateSearchStatus);

            // If not found in current view and village center is slightly different, also check village center
            if (!foundResult && lastGeocodedVillage.lat && map.distance([targetLat, targetLon], [lastGeocodedVillage.lat, lastGeocodedVillage.lon]) > 400) {
                updateSearchStatus('വില്ലേജ് പരിധി പരിശോധിക്കുന്നു...');
                foundResult = await searchSurveyPlotInArea(surveyQuery, lastGeocodedVillage.lat, lastGeocodedVillage.lon, updateSearchStatus);
            }

            if (foundResult) {
                loadingPopup.close();
                if (foundResult.geojson) {
                    const geoLayer = L.geoJSON(foundResult.geojson, {
                        style: {
                            color: '#dc2626',
                            weight: 3,
                            fillColor: '#ef4444',
                            fillOpacity: 0.35
                        }
                    }).addTo(searchResultLayer);
                    const bounds = geoLayer.getBounds();
                    const center = bounds.getCenter();
                    map.fitBounds(bounds, { maxZoom: 18, padding: [40, 40] });
                    inspectAndShowLocationPopup(center.lat, center.lng, foundResult.surveyNo);
                } else if (foundResult.lat && foundResult.lon) {
                    map.setView([foundResult.lat, foundResult.lon], 18);
                    L.circleMarker([foundResult.lat, foundResult.lon], {
                        radius: 14,
                        color: '#dc2626',
                        weight: 3,
                        fillColor: '#ef4444',
                        fillOpacity: 0.35
                    }).addTo(searchResultLayer);
                    inspectAndShowLocationPopup(foundResult.lat, foundResult.lon, foundResult.surveyNo);
                }
            } else {
                loadingPopup.setLatLng(map.getCenter())
                    .setContent(`<div style="color:#ef4444; font-size:13px; text-align:center;">
                        <b>സർവ്വേ നമ്പർ (${surveyQuery}) കണ്ടെത്താനായില്ല!</b><br>
                        <span style="color:#475569; font-size:12px;">നിങ്ങൾ തിരയുന്ന പ്രദേശത്തേക്ക് മാപ്പ് അല്പം കൂടി നീക്കി വീണ്ടും ശ്രമിക്കുക.</span>
                    </div>`);
            }
        }

        async function geocodeVillageName(query) {
            try {
                const searchQuery = query + " village Kerala";
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=1`);
                let data = await res.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: data[0].display_name };
                }
                res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + " Kerala")}&limit=1`);
                data = await res.json();
                if (data && data.length > 0) {
                    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: data[0].display_name };
                }
            } catch (e) {}
            return null;
        }

        function isSurveyMatch(candidateStr, targetStr) {
            if (!candidateStr) return false;
            const c = String(candidateStr).trim().toLowerCase();
            const t = String(targetStr).trim().toLowerCase();
            if (c === t) return true;
            // Match main survey number if sub-division exists (e.g., searching "171" matches "171/1" or "171-A")
            if (c.startsWith(t + '/') || c.startsWith(t + '-') || c.startsWith(t + ' ') || c.startsWith(t + '_')) return true;
            return false;
        }

        // Helper to query WMS at virtual pixel (px, py) on a 1000x1000 canvas with both JSON and HTML support
        async function queryWMSPoint(bboxStr, px, py, featureCount = 25, buffer = 25) {
            const endpoints = [
                'https://bhuvan-panchayat3.nrsc.gov.in/geoserver/v3/wms',
                'https://bhuvan-panchayat3.nrsc.gov.in/geoserver/wms',
                'https://bhuvan-panchayat3.nrsc.gov.in/geoserver/gwc/service/wms'
            ];

            for (const baseUrl of endpoints) {
                try {
                    const baseParams = `${baseUrl}?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS=v3:cadastral&QUERY_LAYERS=v3:cadastral&SRS=EPSG:4326&BBOX=${bboxStr}&WIDTH=1000&HEIGHT=1000&X=${Math.round(px)}&Y=${Math.round(py)}&FEATURE_COUNT=${featureCount}&BUFFER=${buffer}`;
                    
                    // 1. Try JSON first
                    const jsonRes = await fetch(`${baseParams}&INFO_FORMAT=application/json`);
                    if (jsonRes.ok && (jsonRes.headers.get("content-type") || "").includes("json")) {
                        const data = await jsonRes.json();
                        if (data && data.features && data.features.length > 0) {
                            return { type: 'json', features: data.features };
                        }
                    }

                    // 2. Fallback to HTML parsing (Crucial for Bhuvan GeoServer)
                    const htmlRes = await fetch(`${baseParams}&INFO_FORMAT=text/html`);
                    if (htmlRes.ok) {
                        const htmlText = await htmlRes.text();
                        const parsedProps = parseHTMLFeatureInfo(htmlText);
                        if (parsedProps.length > 0) {
                            return { type: 'html', propertiesList: parsedProps };
                        }
                    }
                } catch (e) {}
            }
            return null;
        }

        // Pin-point the exact plot coordinates around a matched grid point
        async function refineExactSurveyPoint(surveyNo, bboxStr, minLon, minLat, maxLon, maxLat, basePx, basePy) {
            const offsets = [
                [0, 0], [-18, 0], [18, 0], [0, -18], [0, 18],
                [-18, -18], [18, -18], [-18, 18], [18, 18],
                [-35, 0], [35, 0], [0, -35], [0, 35]
            ];

            const promises = offsets.map(async ([dx, dy]) => {
                const px = Math.max(5, Math.min(995, basePx + dx));
                const py = Math.max(5, Math.min(995, basePy + dy));
                const res = await queryWMSPoint(bboxStr, px, py, 3, 4);
                if (!res) return null;

                if (res.type === 'json') {
                    for (const feat of res.features) {
                        const sVal = extractSurveyNumber([feat.properties]);
                        if (isSurveyMatch(sVal, surveyNo)) {
                            if (feat.geometry) return { geojson: feat, surveyNo: sVal };
                            const lon = minLon + (px / 1000) * (maxLon - minLon);
                            const lat = maxLat - (py / 1000) * (maxLat - minLat);
                            return { lat, lon, surveyNo: sVal };
                        }
                    }
                } else if (res.type === 'html') {
                    for (const props of res.propertiesList) {
                        const sVal = extractSurveyNumber([props]);
                        if (isSurveyMatch(sVal, surveyNo)) {
                            const lon = minLon + (px / 1000) * (maxLon - minLon);
                            const lat = maxLat - (py / 1000) * (maxLat - minLat);
                            return { lat, lon, surveyNo: sVal };
                        }
                    }
                }
                return null;
            });

            const results = await Promise.all(promises);
            return results.find(r => r !== null) || null;
        }

        async function searchSurveyPlotInArea(surveyNo, centerLat, centerLon, onStatus) {
            // Use current visible map bounds if centerLat/Lon is within the screen, otherwise build a focused box
            const currentBounds = map.getBounds();
            let minLon, minLat, maxLon, maxLat;

            if (currentBounds.contains([centerLat, centerLon]) && map.getZoom() >= 14) {
                const sw = currentBounds.getSouthWest();
                const ne = currentBounds.getNorthEast();
                minLon = sw.lng; minLat = sw.lat;
                maxLon = ne.lng; maxLat = ne.lat;
            } else {
                const delta = 0.009; // ~1km focused box
                minLon = centerLon - delta;
                minLat = centerLat - delta;
                maxLon = centerLon + delta;
                maxLat = centerLat + delta;
            }

            const bboxStr = `${minLon},${minLat},${maxLon},${maxLat}`;

            // Step A: Try WFS GetFeature first (fastest if open)
            const wfsEndpoints = [
                'https://bhuvan-panchayat3.nrsc.gov.in/geoserver/v3/ows',
                'https://bhuvan-panchayat3.nrsc.gov.in/geoserver/ows'
            ];

            for (const url of wfsEndpoints) {
                try {
                    const wfsUrl = `${url}?service=WFS&version=1.0.0&request=GetFeature&typeName=v3:cadastral&bbox=${bboxStr},EPSG:4326&maxFeatures=1000&outputFormat=application/json`;
                    const res = await fetch(wfsUrl);
                    if (res.ok && (res.headers.get("content-type") || "").includes("json")) {
                        const data = await res.json();
                        if (data && data.features && data.features.length > 0) {
                            for (const feat of data.features) {
                                const sVal = extractSurveyNumber([feat.properties]);
                                if (isSurveyMatch(sVal, surveyNo)) {
                                    return { geojson: feat, surveyNo: sVal };
                                }
                            }
                        }
                    }
                } catch (e) {}
            }

            // Step B: Dense Multi-Grid Scan (7x7 = 49 points covering the entire screen/area)
            // Works with both JSON and HTML responses from Bhuvan WMS
            const coords1D = [100, 230, 365, 500, 635, 770, 900];
            const gridPoints = [];
            for (const py of coords1D) {
                for (const px of coords1D) {
                    gridPoints.push([px, py]);
                }
            }
            // Sort from center (500, 500) outward so plots near the center are found fastest
            gridPoints.sort((a, b) => {
                const da = Math.hypot(a[0] - 500, a[1] - 500);
                const db = Math.hypot(b[0] - 500, b[1] - 500);
                return da - db;
            });

            const batchSize = 10;
            for (let i = 0; i < gridPoints.length; i += batchSize) {
                if (onStatus) {
                    const pct = Math.min(95, Math.round(((i + batchSize) / gridPoints.length) * 100));
                    onStatus(`സ്കാൻ ചെയ്യുന്നു (${pct}%)...`);
                }

                const batch = gridPoints.slice(i, i + batchSize);
                const batchPromises = batch.map(async ([px, py]) => {
                    const res = await queryWMSPoint(bboxStr, px, py, 30, 35);
                    if (!res) return null;

                    if (res.type === 'json') {
                        for (const feat of res.features) {
                            const sVal = extractSurveyNumber([feat.properties]);
                            if (isSurveyMatch(sVal, surveyNo)) {
                                if (feat.geometry) {
                                    return { geojson: feat, surveyNo: sVal };
                                }
                                return { px, py, surveyNo: sVal, needsRefinement: true };
                            }
                        }
                    } else if (res.type === 'html') {
                        for (const props of res.propertiesList) {
                            const sVal = extractSurveyNumber([props]);
                            if (isSurveyMatch(sVal, surveyNo)) {
                                return { px, py, surveyNo: sVal, needsRefinement: true };
                            }
                        }
                    }
                    return null;
                });

                const batchResults = await Promise.all(batchPromises);
                const hit = batchResults.find(r => r !== null);

                if (hit) {
                    if (hit.geojson) return hit;

                    // Refine the exact location around (hit.px, hit.py) so marker lands directly inside the plot
                    if (onStatus) onStatus('പ്ലോട്ട് ലൊക്കേഷൻ കൃത്യമാക്കുന്നു...');
                    const refined = await refineExactSurveyPoint(
                        surveyNo, bboxStr, minLon, minLat, maxLon, maxLat, hit.px, hit.py
                    );
                    if (refined) return refined;

                    const estLon = minLon + (hit.px / 1000) * (maxLon - minLon);
                    const estLat = maxLat - (hit.py / 1000) * (maxLat - minLat);
                    return { lat: estLat, lon: estLon, surveyNo: hit.surveyNo };
                }
            }

            return null;
        }

        // ---------- Live GPS Tracking ----------
        let locationMarker, accuracyCircle;
        function onLocationFound(e) {
            let radius = e.accuracy / 2;
            if (locationMarker) map.removeLayer(locationMarker);
            if (accuracyCircle) map.removeLayer(accuracyCircle);
            accuracyCircle = L.circle(e.latlng, radius, { color: '#007bff', fillColor: '#007bff', fillOpacity: 0.15, weight: 2 }).addTo(map);
            locationMarker = L.marker(e.latlng, { icon: L.divIcon({ className: 'custom-location-marker', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map).bindPopup("നിങ്ങളുടെ ലൊക്കേഷൻ").openPopup();
            map.setView(e.latlng, 17);
        }

        function onLocationError(e) { showToast("ലൊക്കേഷൻ ആക്സസ് നിഷേധിക്കപ്പെട്ടു. ജിപിഎസ് ഓൺ ചെയ്യുക."); }

        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);

        document.getElementById('locateBtn').addEventListener('click', () => {
            map.stopLocate(); 
            map.closePopup();
            map.locate({setView: true, maxZoom: 17, enableHighAccuracy: true});
        });

        // ---------- 4. Register Service Worker ----------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
